[project]
name = "deskmate-agent"
version = "0.1.0"
description = "Deskmate macOS companion agent core (V10 unified baseline)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Deskmate Contributors" },
]

# Phase 14-i: exposes the ``deskmate`` CLI used by external tools
# (Makefile / pytest / CI) to drive the build-status island pill.
[project.scripts]
deskmate = "deskmate_agent.cli:main"

dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
runtime = [
    "openai>=1.50",
    "jinja2>=3.1",
    "uvloop>=0.20; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deskmate_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=10"
asyncio_mode = "auto"
timeout = 10

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
